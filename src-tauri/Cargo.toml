[package]
name = "stasis"
version = "1.0.0"
edition = "2021"
[build-dependencies]
tauri-build = "2"
[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
chrono = "0.4"
[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
